<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .center { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; }
  .drop { position: absolute; left: 50%; top: 520px; width: 120px; margin-left: -60px; animation: fall .9s cubic-bezier(.55,0,1,.45) .2s both, squash .35s ease-out 1.1s both; }
  @keyframes fall { from { transform: translateY(-760px); } to { transform: translateY(0); } }
  @keyframes squash { 0% { transform: scale(1); opacity: 1; } 40% { transform: scaleX(1.6) scaleY(.35) translateY(120px); opacity: 1; } 100% { transform: scaleX(2.4) scaleY(.1) translateY(200px); opacity: 0; } }
  .ripple { position: absolute; left: 540px; top: 700px; width: 240px; height: 70px; margin: -35px 0 0 -120px; border: 3px solid var(--gold); border-radius: 50%; animation: ripple 1.8s ease-out both; }
  @keyframes ripple { from { transform: scale(.2); opacity: .9; } to { transform: scale(4.2); opacity: 0; } }
  .typed { font-family: "JetBrains Mono", monospace; font-size: 46px; white-space: nowrap; overflow: hidden; border-right: 0; }
  .t1 { width: 0; animation: type1 1.3s steps(26) 1.7s both; }
  .t2 { width: 0; animation: type2 .9s steps(18) 3.2s both; color: var(--gold); }
  @keyframes type1 { to { width: 26ch; } }
  @keyframes type2 { to { width: 18ch; } }
  .caret { display: inline-block; width: 22px; height: 52px; background: var(--gold); vertical-align: middle; animation: blink .8s linear 0s 12 both; }
  .lines { top: 560px; gap: 22px; animation: fadeOutUp .5s ease-in 4.7s both; }
  .flash { position: absolute; inset: 0; background: radial-gradient(40% 35% at 50% 45%, rgb(245 184 61 / .55), transparent 70%); animation: flash 1.4s ease-out 5.0s both; }
  @keyframes flash { 0% { opacity: 0; } 25% { opacity: 1; } 100% { opacity: .35; } }
  .logo { position: absolute; left: 50%; top: 330px; width: 150px; margin-left: -75px; animation: pop .7s cubic-bezier(.2,.7,.2,1) 5.1s both; }
  .title { top: 540px; font-size: 172px; font-weight: 700; letter-spacing: -.04em; display: flex; flex-direction: row; justify-content: center; }
  .title span { display: inline-block; animation: rise .7s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(80px) rotate(4deg); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
  .tag { top: 760px; font-size: 54px; font-weight: 600; animation: fadeUp .8s cubic-bezier(.2,.7,.2,1) 6.3s both; }
  .soon { top: 880px; animation: fadeIn .8s ease 7.0s both; }
  .pill { font-family: "JetBrains Mono", monospace; font-size: 26px; letter-spacing: .18em; padding: 16px 30px; border: 2px solid rgb(245 184 61 / .4); background: rgb(245 184 61 / .08); color: var(--gold); border-radius: 999px; }
  .strip { position: absolute; left: 0; right: 0; bottom: 170px; border-top: 1.5px solid var(--pipe); border-bottom: 1.5px solid var(--pipe); background: var(--well); overflow: hidden; animation: fadeIn .6s ease 6.6s both; }
  .strip .row { display: flex; width: max-content; gap: 60px; padding: 22px 0; font-family: "JetBrains Mono", monospace; font-size: 30px; color: var(--smoke); animation: ticker 9s linear 0s both; }
  .strip b { color: var(--gold); font-weight: 500; }
  .brandbar { animation: fadeIn .6s ease 7.2s both; }
</style></head>
<body><div class="stage">
  <div class="grid"></div>
  <img class="drop" src="drop.svg">
  <div class="ripple" style="animation-delay:1.1s"></div>
  <div class="ripple" style="animation-delay:1.35s"></div>
  <div class="ripple" style="animation-delay:1.6s"></div>

  <div class="center lines">
    <div><span class="typed t1" style="display:inline-block">SOMETHING IS BEING DRILLED</span></div>
    <div><span class="typed t2" style="display:inline-block">ON ROBINHOOD CHAIN</span><span style="display:inline-block;animation:fadeIn .01s linear 3.2s both"><span class="caret"></span></span></div>
  </div>

  <div class="flash"></div>
  <img class="logo" src="drop.svg">
  <div class="center title" id="title"></div>
  <div class="center tag">The oil of the people.</div>
  <div class="center soon"><span class="pill">COMING SOON</span></div>

  <div class="strip"><div class="row">
    <span><b>WTI</b> crude</span><span><b>BRENT</b> crude</span><span><b>USO</b> tokenized</span><span><b>XOM</b> tokenized</span><span><b>$OILHOOD</b></span><span>virtual barrels</span>
    <span><b>WTI</b> crude</span><span><b>BRENT</b> crude</span><span><b>USO</b> tokenized</span><span><b>XOM</b> tokenized</span><span><b>$OILHOOD</b></span><span>virtual barrels</span>
  </div></div>

  <div class="brandbar"><span class="name"><img src="drop.svg" width="40"><span>Oil<span class="gold">Hood</span></span></span><span class="label">Robinhood Chain · 4663</span></div>
</div>
<script>
  const t = document.getElementById("title");
  [..."$OILHOOD"].forEach((c, i) => {
    const s = document.createElement("span");
    s.textContent = c; s.className = "gold"; s.style.animationDelay = (5.25 + i * 0.07) + "s";
    t.appendChild(s);
  });
</script>
<script src="timeline.js"></script>
</body></html>
