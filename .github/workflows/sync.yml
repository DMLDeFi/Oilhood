name: Sync on-chain data

# Keeps the $OILHOOD indexer and Virtual Rigs scoring running every 5 minutes.
# Setup: repo Settings → Secrets and variables → Actions →
#   secret  CRON_SECRET  (same value as in Vercel)
#   variable SITE_URL    (e.g. https://oilhood.vercel.app)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.SITE_URL || 'https://oilhood.vercel.app' }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set, skipping"; exit 0; fi
          curl -fsS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/sync"
